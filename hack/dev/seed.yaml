# Seed workloads for the k3d dev cluster (applied by `make dev-seed`).
# Every workload is tiny and uses two shared images, so image deduplication,
# owner resolution (Deployment, CronJob, bare Pod) and init containers can be
# exercised:
#   busybox:1.36.1  production/web, staging/web, staging/debug
#   alpine:3.19.1   production/report (CronJob), staging/debug (init container)
apiVersion: v1
kind: Namespace
metadata:
  name: krivy-system
  labels:
    krivy.dev/seed-stage: namespace
---
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    krivy.dev/seed-stage: namespace
---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    krivy.dev/seed-stage: namespace
---
# Low-privilege identity for Trivy scanner Jobs (mirrors the Helm chart).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krivy-scanner
  namespace: krivy-system
  labels:
    app.kubernetes.io/name: krivy
    app.kubernetes.io/component: scanner
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: production
  labels: {app: web}
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      securityContext: {runAsNonRoot: true, runAsUser: 65534}
      containers:
        - name: web
          image: busybox:1.36.1
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: staging
  labels: {app: web}
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      securityContext: {runAsNonRoot: true, runAsUser: 65534}
      containers:
        - name: web
          image: busybox:1.36.1
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
---
# CronJob pods only exist while a run is active (~4 of every 5 minutes).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  namespace: production
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 120
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 1
          securityContext: {runAsNonRoot: true, runAsUser: 65534}
          containers:
            - name: report
              image: alpine:3.19.1
              command: ["sh", "-c", "sleep 240"]
              resources:
                requests: {cpu: 5m, memory: 8Mi}
                limits: {memory: 32Mi}
---
# Bare Pod with an init container using the second shared image.
apiVersion: v1
kind: Pod
metadata:
  name: debug
  namespace: staging
  labels: {app: debug}
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 1
  securityContext: {runAsNonRoot: true, runAsUser: 65534}
  initContainers:
    - name: init
      image: alpine:3.19.1
      command: ["sh", "-c", "echo init done"]
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {memory: 32Mi}
  containers:
    - name: debug
      image: busybox:1.36.1
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {memory: 32Mi}
