name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  K3D_VERSION: v5.8.3

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go mod verify
        run: go mod verify
      - name: go test -race
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt -s formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: shell scripts
        run: |
          for f in hack/*.sh; do sh -n "$f"; done
          shellcheck -s sh hack/*.sh

  build-image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/l4r-s/krivy:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker image inspect ghcr.io/l4r-s/krivy:ci --format 'user={{.Config.User}} entrypoint={{.Config.Entrypoint}}'
          test "$(docker image inspect ghcr.io/l4r-s/krivy:ci --format '{{.Config.User}}')" = "65532:65532"

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: |
          helm lint charts/krivy
          for f in charts/krivy/ci/*.yaml; do helm lint charts/krivy -f "$f"; done
      - name: helm template
        run: |
          for f in charts/krivy/ci/*.yaml; do
            echo "--- $f"
            helm template krivy charts/krivy --namespace krivy-system -f "$f" >/dev/null
          done
      - name: chart tests
        run: sh hack/chart-test.sh

  integration:
    name: Integration (k3d)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install k3d ${{ env.K3D_VERSION }}
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/${K3D_VERSION}/install.sh | TAG=${K3D_VERSION} bash
      - name: Create and seed dev cluster
        run: make dev-cluster dev-seed
      - name: Integration tests
        run: make test-integration
      - name: Diagnostics
        if: failure()
        run: |
          KC="--kubeconfig .dev/kubeconfig --context k3d-krivy-dev"
          kubectl $KC get nodes -o wide || true
          kubectl $KC get pods,jobs -A -o wide || true
          kubectl $KC get events -A --sort-by=.lastTimestamp | tail -n 100 || true
      - name: Destroy cluster
        if: always()
        run: make dev-destroy || true

  mandatory-checks:
    name: Mandatory checks
    if: always()
    needs: [go-test, lint, build-image, chart, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' >/dev/null
