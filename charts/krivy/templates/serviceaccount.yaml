{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "krivy.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "krivy.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.scanner.serviceAccount.create }}
---
# Identity of the Trivy scanner Job pods: no RBAC, no API token mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "krivy.scannerServiceAccountName" . }}
  namespace: {{ include "krivy.jobNamespace" . }}
  labels:
    {{- include "krivy.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
  {{- with .Values.scanner.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- with .Values.scanner.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
