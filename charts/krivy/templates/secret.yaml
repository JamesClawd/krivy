{{- if and .Values.secret.create (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "krivy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "krivy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
